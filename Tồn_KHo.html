<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống Quản lý Kho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    input, button {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    label {
      margin-top: 10px;
      display: block;
    }

    button {
      background-color: #3498db;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #2980b9;
    }

    .section {
      margin-top: 30px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .col {
      flex: 1;
      min-width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
    }

    .warning {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }

    .summary {
      margin-top: 10px;
      font-weight: bold;
    }

    @media screen and (max-width: 600px) {
      .row {
        flex-direction: column;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
  <h2>📦 Hệ thống Quản lý Kho</h2>

  <!-- Thêm / cập nhật sản phẩm -->
  <div class="section">
    <h3>➕ Thêm / Cập nhật sản phẩm</h3>
    <div class="row">
      <div class="col">
        <label>Tên sản phẩm</label>
        <input type="text" id="name">
      </div>
      
      <div class="col">
        <label>Mô tả</label>
        <input type="text" id="description">
      </div>
      <div class="col">
        <label>Số lượng</label>
        <input type="number" id="quantity" min="0">
      </div>
      <div class="col">
        <label>Giá</label>
        <input type="number" id="price" step="0.01" min="0">
      </div>
        <div class="col">
        <label>Ngày nhập</label>
        <input type="date" id="date">
      </div>
    </div>
    <button onclick="addOrUpdateProduct()">💾 Lưu sản phẩm</button>
  </div>

  <!-- Nhập / Xuất hàng -->
  <div class="section">
    <h3>🔄 Nhập / Xuất kho</h3>
    <div class="row">
      <div class="col">
        <label>Tên sản phẩm</label>
        <input type="text" id="action-name">
      </div>
      <div class="col">
        <label>Số lượng</label>
        <input type="number" id="amount" min="1">
      </div>
    </div>
    <button onclick="restockProduct()">⬆️ Nhập hàng</button>
    <button onclick="sellProduct()">⬇️ Xuất hàng</button>
  </div>

  <!-- Danh sách -->
  <div class="section">
    <h3>📋 Danh sách sản phẩm</h3>
    <input type="text" id="search" placeholder="🔍 Tìm kiếm theo tên..." oninput="renderTable()">
    <button onclick="exportToExcel()">📤 Xuất Excel</button>
    <table id="productTable">
      <thead>
      <tr>
        <th>Tên</th>
        <th>Mô tả</th>
        <th>Số lượng</th>
        <th>Giá</th>
        <th>Tổng tiền</th>
        <th>Ngày nhập</th>
        <th>Hành động</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="summary" id="inventorySummary"></div>
    <div class="warning" id="lowStockWarning"></div>
  </div>

  <!-- Lịch sử xuất -->
  <div class="section">
    <h3>📦 Lịch sử xuất hàng</h3>
    <ul id="salesHistory"></ul>
    <p class="summary">💰 Tổng tiền đã bán: <span id="totalRevenue">0</span> VND</p>
  </div>
</div>

<script>
  const inventory = {};
  const LOW_STOCK_THRESHOLD = 10;
  let sales = [];

  function addOrUpdateProduct() {
    const name = document.getElementById("name").value.trim();
    const description = document.getElementById("description").value.trim();
    const quantity = parseInt(document.getElementById("quantity").value);
    const price = parseFloat(document.getElementById("price").value);
    const date = document.getElementById("date").value || new Date().toISOString().split("T")[0];

    if (!name || isNaN(quantity) || isNaN(price)) {
      alert("Vui lòng nhập đầy đủ và hợp lệ.");
      return;
    }

    inventory[name] = { description, quantity, price, date };
    clearInputs();
    renderTable();
  }

  function restockProduct() {
    const name = document.getElementById("action-name").value.trim();
    const amount = parseInt(document.getElementById("amount").value);
    if (!inventory[name]) return alert("Sản phẩm không tồn tại.");
    inventory[name].quantity += amount;
    renderTable();
  }

  function sellProduct() {
    const name = document.getElementById("action-name").value.trim();
    const amount = parseInt(document.getElementById("amount").value);
    if (!inventory[name]) return alert("Sản phẩm không tồn tại.");
    if (amount > inventory[name].quantity) return alert("Không đủ hàng.");
    inventory[name].quantity -= amount;
    const total = inventory[name].price * amount;
    sales.push({ name, amount, total });
    renderSalesHistory();
    renderTable();
  }

  function deleteProduct(name) {
    if (confirm(`Xóa '${name}'?`)) {
      delete inventory[name];
      renderTable();
    }
  }

  function renderTable() {
    const tbody = document.querySelector("#productTable tbody");
    tbody.innerHTML = "";
    const keyword = document.getElementById("search").value.trim().toLowerCase();
    let warnings = [], totalItems = 0, totalValue = 0;

    for (const name in inventory) {
      if (keyword && !name.toLowerCase().includes(keyword)) continue;

      const item = inventory[name];
      const total = item.quantity * item.price;
      totalItems += item.quantity;
      totalValue += total;

      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${name}</td>
        <td>${item.description}</td>
        <td contenteditable onblur="updateValue('${name}', 'quantity', this.innerText)">${item.quantity}</td>
        <td contenteditable onblur="updateValue('${name}', 'price', this.innerText)">${item.price.toFixed(2)}</td>
        <td>${item.date || ''}</td>
        <td>${total.toFixed(2)}</td>
        <td><button onclick="deleteProduct('${name}')">🗑 Xóa</button></td>
      `;

      if (item.quantity < LOW_STOCK_THRESHOLD) {
        warnings.push(`- ${name} chỉ còn ${item.quantity} đơn vị.`);
      }
    }

    document.getElementById("lowStockWarning").innerHTML =
      warnings.length ? `<p>Cảnh báo:</p><ul><li>${warnings.join("</li><li>")}</li></ul>` : "";

    document.getElementById("inventorySummary").innerText =
      `📦 Tổng số hàng: ${totalItems} | 💰 Tổng giá trị tồn kho: ${totalValue.toLocaleString()} VND`;
  }

  function updateValue(name, field, value) {
    if (field === 'quantity') inventory[name].quantity = parseInt(value) || 0;
    if (field === 'price') inventory[name].price = parseFloat(value) || 0;
    renderTable();
  }

  function renderSalesHistory() {
    const list = document.getElementById("salesHistory");
    list.innerHTML = "";
    let totalRevenue = 0;
    sales.forEach(s => {
      const li = document.createElement("li");
      li.textContent = `Đã xuất ${s.amount} x '${s.name}' = ${s.total.toLocaleString()} VND`;
      list.appendChild(li);
      totalRevenue += s.total;
    });
    document.getElementById("totalRevenue").innerText = totalRevenue.toLocaleString();
  }

  function clearInputs() {
    document.getElementById("name").value = "";
    document.getElementById("description").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";
    document.getElementById("date").value = "";
  }

  function exportToExcel() {
    const wb = XLSX.utils.book_new();
    const productData = [["Tên", "Mô tả", "Số lượng", "Giá", "Ngày", "Tổng tiền"]];
    for (const name in inventory) {
      const i = inventory[name];
      productData.push([name, i.description, i.quantity, i.price, i.date || '', i.quantity * i.price]);
    }
    const productSheet = XLSX.utils.aoa_to_sheet(productData);
    XLSX.utils.book_append_sheet(wb, productSheet, "Sản phẩm");

    const salesData = [["Tên sản phẩm", "Số lượng", "Tổng tiền"]];
    sales.forEach(s => salesData.push([s.name, s.amount, s.total]));
    const salesSheet = XLSX.utils.aoa_to_sheet(salesData);
    XLSX.utils.book_append_sheet(wb, salesSheet, "Xuất hàng");

    XLSX.writeFile(wb, "QuanLyKho_CoNgay.xlsx");
  }
</script>
</body>
</html>
